<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SERPRO 2023 — Base de estudos</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=DM+Mono:wght@400;500&family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;1,9..40,300&display=swap"
      rel="stylesheet"
    />
    <style>
      *,
      *::before,
      *::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      :root {
        --bg: #0e0e10;
        --surface: #17171a;
        --border: #2a2a2e;
        --border2: #3a3a40;
        --text: #e8e8ec;
        --muted: #7a7a85;
        --accent: #c9a84c;
        --accent2: #8b5cf6;
        --danger: #e05252;
        --success: #4caf82;
        --mono: 'DM Mono', monospace;
        --sans: 'DM Sans', sans-serif;
        --serif: 'DM Serif Display', serif;
        --header-h: 52px;
        --status-h: 28px;
        --sidebar-w: 220px;
        --bnav-h: 58px;
      }

      html,
      body {
        height: 100%;
        overflow: hidden;
      }

      body {
        font-family: var(--sans);
        background: var(--bg);
        color: var(--text);
        display: flex;
        flex-direction: column;
        font-size: 14px;
        line-height: 1.6;
      }

      /* ─── HEADER ─── */
      .header {
        height: var(--header-h);
        flex-shrink: 0;
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 0 1rem;
        background: var(--surface);
        border-bottom: 1px solid var(--border);
        z-index: 200;
      }

      .hamburger {
        display: none;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        gap: 4px;
        width: 44px;
        height: 44px;
        padding: 0;
        border-radius: 6px;
        border: 1px solid var(--border);
        background: transparent;
        cursor: pointer;
        flex-shrink: 0;
      }
      .hamburger span {
        display: block;
        width: 20px;
        height: 2px;
        background: var(--muted);
        border-radius: 2px;
        transition:
          transform 0.2s,
          opacity 0.2s;
      }
      .hamburger.open span:nth-child(1) {
        transform: translateY(6px) rotate(45deg);
      }
      .hamburger.open span:nth-child(2) {
        opacity: 0;
      }
      .hamburger.open span:nth-child(3) {
        transform: translateY(-6px) rotate(-45deg);
      }

      .logo {
        font-family: var(--serif);
        font-size: 1.05rem;
        color: var(--accent);
        white-space: nowrap;
        flex-shrink: 0;
      }
      .logo span {
        font-family: var(--sans);
        font-size: 0.68rem;
        font-weight: 300;
        color: var(--muted);
        margin-left: 5px;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }

      .header-sep {
        width: 1px;
        height: 18px;
        background: var(--border);
        flex-shrink: 0;
      }

      .tabs-wrapper {
        display: flex;
        align-items: center;
        gap: 2px;
        flex: 1;
        overflow-x: auto;
        scrollbar-width: none;
      }
      .tabs-wrapper::-webkit-scrollbar {
        display: none;
      }

      .tab {
        display: flex;
        align-items: center;
        gap: 5px;
        padding: 5px 12px;
        border-radius: 5px;
        font-size: 0.78rem;
        color: var(--muted);
        white-space: nowrap;
        border: 1px solid transparent;
        background: transparent;
        cursor: pointer;
        font-family: var(--sans);
        transition:
          color 0.15s,
          background 0.15s,
          border-color 0.15s;
      }
      .tab:hover {
        color: var(--text);
        background: rgba(255, 255, 255, 0.04);
      }
      .tab.active {
        color: var(--accent);
        background: rgba(201, 168, 76, 0.08);
        border-color: rgba(201, 168, 76, 0.2);
      }
      .tab .dot {
        width: 5px;
        height: 5px;
        border-radius: 50%;
        background: currentColor;
        opacity: 0.5;
        flex-shrink: 0;
      }

      /* ─── BODY WRAP ─── */
      .body-wrap {
        display: flex;
        flex: 1;
        overflow: hidden;
        position: relative;
      }

      /* ─── DRAWER OVERLAY ─── */
      .drawer-overlay {
        display: none;
        position: fixed;
        inset: 0;
        background: rgba(0, 0, 0, 0.55);
        z-index: 150;
        opacity: 0;
        transition: opacity 0.25s;
      }
      .drawer-overlay.visible {
        display: block;
      }
      .drawer-overlay.open {
        opacity: 1;
      }

      /* ─── SIDEBAR ─── */
      .sidebar {
        width: var(--sidebar-w);
        flex-shrink: 0;
        background: var(--surface);
        border-right: 1px solid var(--border);
        display: flex;
        flex-direction: column;
        overflow-y: auto;
        scrollbar-width: thin;
        scrollbar-color: var(--border) transparent;
      }

      .sb-section {
        padding: 1.1rem 0.9rem 0.4rem;
      }
      .sb-label {
        font-family: var(--mono);
        font-size: 0.62rem;
        text-transform: uppercase;
        letter-spacing: 0.12em;
        color: var(--muted);
        margin-bottom: 0.45rem;
      }
      .sb-item {
        display: flex;
        align-items: center;
        gap: 7px;
        padding: 6px 8px;
        border-radius: 5px;
        font-size: 0.78rem;
        color: var(--muted);
        cursor: pointer;
        text-decoration: none;
        border: 1px solid transparent;
        transition:
          color 0.15s,
          background 0.15s;
      }
      .sb-item:hover {
        color: var(--text);
        background: rgba(255, 255, 255, 0.04);
      }
      .sb-item.active {
        color: var(--text);
        background: rgba(255, 255, 255, 0.06);
        border-color: var(--border);
      }
      .sb-item .icon {
        width: 15px;
        text-align: center;
        flex-shrink: 0;
        font-size: 11px;
      }
      .sb-divider {
        margin: 0.2rem 0.9rem;
        border: none;
        border-top: 1px solid var(--border);
      }

      .bpill {
        margin-left: auto;
        flex-shrink: 0;
        font-family: var(--mono);
        font-size: 0.58rem;
        padding: 1px 5px;
        border-radius: 8px;
        border: 1px solid rgba(201, 168, 76, 0.25);
        color: var(--accent);
        background: rgba(201, 168, 76, 0.08);
      }
      .bpill.r {
        border-color: rgba(224, 82, 82, 0.25);
        color: var(--danger);
        background: rgba(224, 82, 82, 0.08);
      }
      .bpill.p {
        border-color: rgba(139, 92, 246, 0.25);
        color: var(--accent2);
        background: rgba(139, 92, 246, 0.08);
      }
      .bpill.g {
        border-color: rgba(76, 175, 130, 0.25);
        color: var(--success);
        background: rgba(76, 175, 130, 0.08);
      }

      /* ─── CONTENT ─── */
      .content {
        flex: 1;
        overflow: hidden;
        display: flex;
        flex-direction: column;
        background: var(--bg);
      }

      #module-frame {
        width: 100%;
        flex: 1;
        border: none;
        display: none;
      }

      /* ─── WELCOME ─── */
      .welcome {
        flex: 1;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 1.25rem;
        padding: 1.5rem;
        overflow-y: auto;
      }
      .w-title {
        font-family: var(--serif);
        font-size: clamp(1.5rem, 4vw, 2.2rem);
        text-align: center;
        line-height: 1.2;
      }
      .w-title em {
        color: var(--accent);
        font-style: normal;
      }
      .w-sub {
        font-size: 0.82rem;
        color: var(--muted);
        text-align: center;
        max-width: 400px;
        line-height: 1.7;
      }

      .w-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
        gap: 10px;
        width: 100%;
        max-width: 680px;
      }
      .w-card {
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 10px;
        padding: 1rem 1.1rem;
        cursor: pointer;
        transition:
          border-color 0.2s,
          background 0.2s,
          transform 0.15s;
      }
      .w-card:hover {
        border-color: var(--border2);
        background: #1e1e22;
        transform: translateY(-1px);
      }
      .w-card-icon {
        font-size: 1.2rem;
        margin-bottom: 0.35rem;
      }
      .w-card-title {
        font-size: 0.82rem;
        font-weight: 500;
        color: var(--text);
        margin-bottom: 0.15rem;
      }
      .w-card-sub {
        font-size: 0.72rem;
        color: var(--muted);
        line-height: 1.5;
      }

      .tag-row {
        display: flex;
        flex-wrap: wrap;
        gap: 5px;
        justify-content: center;
        max-width: 500px;
      }
      .tag {
        font-family: var(--mono);
        font-size: 0.62rem;
        padding: 2px 8px;
        border-radius: 4px;
        border: 1px solid var(--border2);
        color: var(--muted);
      }

      /* ─── STATUS BAR ─── */
      .statusbar {
        height: var(--status-h);
        flex-shrink: 0;
        display: flex;
        align-items: center;
        padding: 0 1rem;
        gap: 1rem;
        font-family: var(--mono);
        font-size: 0.62rem;
        color: var(--muted);
        background: var(--surface);
        border-top: 1px solid var(--border);
      }
      .s-dot {
        width: 5px;
        height: 5px;
        border-radius: 50%;
        background: var(--success);
        display: inline-block;
        margin-right: 3px;
      }
      .statusbar-right {
        margin-left: auto;
        display: flex;
        gap: 0.75rem;
      }

      /* ─── BACK BAR — mobile ─── */
      .back-bar {
        display: none;
        align-items: center;
        gap: 8px;
        padding: 0 1rem;
        height: 48px;
        flex-shrink: 0;
        border-bottom: 1px solid var(--border);
        background: var(--surface);
      }
      .back-btn {
        display: flex;
        align-items: center;
        gap: 4px;
        font-size: 0.85rem;
        color: var(--muted);
        background: transparent;
        border: none;
        cursor: pointer;
        font-family: var(--sans);
        height: 100%;
        min-height: 44px;
        padding: 0 8px;
      }
      .back-btn:hover {
        color: var(--text);
      }
      .back-title {
        font-size: 0.85rem;
        font-weight: 500;
        color: var(--text);
      }

      /* ─── INLINE CONTENT — mobile ─── */
      #module-inline {
        display: none;
        flex: 1;
        overflow-y: auto;
      }

      /* ─── BOTTOM NAV — mobile ─── */
      .bottom-nav {
        display: none;
        position: fixed;
        bottom: 0;
        left: 0;
        right: 0;
        height: var(--bnav-h);
        background: var(--surface);
        border-top: 1px solid var(--border);
        z-index: 100;
      }
      .bottom-nav-inner {
        display: flex;
        height: 100%;
        overflow-x: auto;
        scrollbar-width: none;
        gap: 2px;
        padding: 5px 6px;
      }
      .bottom-nav-inner::-webkit-scrollbar {
        display: none;
      }
      .bnav-btn {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 2px;
        padding: 4px 10px;
        border-radius: 7px;
        font-size: 0.6rem;
        font-family: var(--sans);
        color: var(--muted);
        background: transparent;
        border: 1px solid transparent;
        cursor: pointer;
        white-space: nowrap;
        flex-shrink: 0;
        min-width: 58px;
        transition:
          color 0.15s,
          background 0.15s;
      }
      .bnav-btn .bnav-icon {
        font-size: 0.9rem;
      }
      .bnav-btn.active {
        color: var(--accent);
        background: rgba(201, 168, 76, 0.08);
        border-color: rgba(201, 168, 76, 0.18);
      }
      .bnav-btn:hover {
        color: var(--text);
      }

      /* ═══════════════════════════════════════
       RESPONSIVE
    ═══════════════════════════════════════ */

      /* Tablet — sem texto do logo */
      @media (max-width: 860px) {
        .logo span {
          display: none;
        }
      }

      /* Mobile ≤ 640px */
      @media (max-width: 640px) {
        html,
        body {
          overflow: auto;
          height: auto;
        }

        .body-wrap {
          flex-direction: column;
          overflow: visible;
        }
        .content {
          overflow: visible;
        }

        /* header fixo */
        .header {
          position: sticky;
          top: 0;
        }

        /* hamburger aparece, tabs some */
        .hamburger {
          display: flex;
        }
        .tabs-wrapper {
          display: none;
        }
        .header-sep {
          display: none;
        }

        /* sidebar vira drawer */
        .sidebar {
          position: fixed;
          top: 0;
          left: 0;
          bottom: 0;
          z-index: 160;
          transform: translateX(-100%);
          width: min(280px, 80vw);
          padding-top: var(--header-h);
          transition: transform 0.25s ease;
        }
        .sidebar.open {
          transform: translateX(0);
        }

        /* Aumento do touch target dos itens da sidebar em mobile */
        .sb-item {
          padding: 10px 12px;
          min-height: 44px;
          font-size: 0.85rem;
        }
        .sb-label {
          font-size: 0.68rem;
          margin-bottom: 0.6rem;
        }

        /* iframe off, inline on */
        #module-frame {
          display: none !important;
        }
        #module-inline {
          display: none;
        }

        /* back bar e bottom nav aparecem */
        .back-bar {
          display: flex;
        }
        .bottom-nav {
          display: block;
        }

        /* status bar off */
        .statusbar {
          display: none;
        }

        /* welcome tem espaço para bnav */
        .welcome {
          padding-bottom: calc(var(--bnav-h) + 1rem);
          justify-content: flex-start;
          padding-top: 2rem;
        }
      }

      /* Desktop ≥ 641px — garante que elementos mobile somem */
      @media (min-width: 641px) {
        .drawer-overlay {
          display: none !important;
        }
        .back-bar {
          display: none !important;
        }
        .bottom-nav {
          display: none !important;
        }
        .hamburger {
          display: none !important;
        }
        #module-inline {
          display: none !important;
        }
      }

      /* Tela muito larga — sidebar um pouco maior */
      @media (min-width: 1200px) {
        :root {
          --sidebar-w: 240px;
        }
      }
    </style>
  </head>
  <body>
    <!-- HEADER -->
    <header class="header">
      <button
        class="hamburger"
        id="hamburger"
        aria-label="Abrir menu"
        aria-expanded="false"
      >
        <span></span><span></span><span></span>
      </button>
      <div class="logo">SERPRO <span>· estudos 2023</span></div>
      <div class="header-sep"></div>
      <nav
        class="tabs-wrapper"
        id="tabs-nav"
        role="tablist"
        aria-label="Módulos de estudo"
      ></nav>
    </header>

    <!-- OVERLAY -->
    <div class="drawer-overlay" id="overlay" aria-hidden="true"></div>

    <!-- BODY -->
    <div class="body-wrap">
      <aside class="sidebar" id="sidebar" aria-label="Navegação lateral">
        <div id="sidebar-inner"></div>
      </aside>

      <main class="content" id="content">
        <!-- back bar mobile -->
        <div class="back-bar" id="back-bar" style="display: none">
          <button class="back-btn" onclick="goHome()">← início</button>
          <span class="back-title" id="back-title"></span>
        </div>

        <!-- welcome screen -->
        <div class="welcome" id="welcome-screen">
          <div class="w-title">Base de <em>estudos</em><br />para o SERPRO</div>
          <p class="w-sub">
            Selecione um módulo abaixo ou na barra lateral para começar.
          </p>
          <div class="w-grid" id="welcome-grid"></div>
          <div class="tag-row" id="tag-row"></div>
        </div>

        <!-- iframe — desktop -->
        <iframe id="module-frame" title="Módulo de estudo"></iframe>

        <!-- inline — mobile -->
        <div id="module-inline"></div>
      </main>
    </div>

    <!-- STATUS BAR — desktop -->
    <footer class="statusbar">
      <span><span class="s-dot"></span>online</span>
      <span id="sb-module">nenhum módulo aberto</span>
      <div class="statusbar-right">
        <span id="sb-count">0 módulos</span>
        <span>Cebraspe · Analista TI</span>
      </div>
    </footer>

    <!-- BOTTOM NAV — mobile -->
    <nav class="bottom-nav" aria-label="Navegação">
      <div class="bottom-nav-inner" id="bnav-inner"></div>
    </nav>

    <script>
      /* ═══════════════════════════════════════════════════════
   MÓDULOS
   Para adicionar: crie o .html em /modulos/ e insira
   um objeto aqui seguindo o mesmo padrão.
   ═══════════════════════════════════════════════════════ */
      const MODULES = [
        {
          id: 'serpro',
          title: 'SERPRO',
          file: 'modulos/serpro/index.html',
          icon: '▣',
          tag: 'alta',
          desc: 'Navegue por pastas e semanas do estudo SERPRO',
          group: 'especificos',
        },
        /* ── ADICIONE NOVOS MÓDULOS ABAIXO ── */
      ];

      const GROUPS = {
        basicos: { label: 'P1 · Básicos' },
        especificos: { label: 'P2 · Específicos' },
        pratica: { label: 'P3 · Prática' },
      };

      const TAG_MAP = {
        alta: { text: 'alta', cls: 'r' },
        media: { text: 'média', cls: '' },
        baixa: { text: 'baixa', cls: 'g' },
        p1: { text: 'P1', cls: '' },
        p3: { text: 'P3', cls: 'p' },
      };

      const TOPIC_TAGS = [
        'Banco de dados',
        'SQL',
        'Algoritmos',
        'Lógica',
        'Segurança',
        'LGPD',
        'DevOps',
        'Arquitetura',
        'Nuvem',
        'OOP',
      ];

      /* ─── estado ─── */
      let activeId = null;
      let drawerOpen = false;
      const isMobile = () => window.innerWidth <= 640;

      /* ─── drawer ─── */
      function openDrawer() {
        document.getElementById('sidebar').classList.add('open');
        const ov = document.getElementById('overlay');
        ov.classList.add('visible');
        requestAnimationFrame(() => ov.classList.add('open'));
        document.getElementById('hamburger').classList.add('open');
        document
          .getElementById('hamburger')
          .setAttribute('aria-expanded', 'true');
        document.body.style.overflow = 'hidden';
        drawerOpen = true;
      }
      function closeDrawer() {
        document.getElementById('sidebar').classList.remove('open');
        const ov = document.getElementById('overlay');
        ov.classList.remove('open');
        document.getElementById('hamburger').classList.remove('open');
        document
          .getElementById('hamburger')
          .setAttribute('aria-expanded', 'false');
        document.body.style.overflow = '';
        drawerOpen = false;
        setTimeout(() => ov.classList.remove('visible'), 260);
      }
      document
        .getElementById('hamburger')
        .addEventListener('click', () =>
          drawerOpen ? closeDrawer() : openDrawer(),
        );
      document.getElementById('overlay').addEventListener('click', closeDrawer);
      document.addEventListener('keydown', (e) => {
        if (e.key === 'Escape' && drawerOpen) closeDrawer();
      });

      /* ─── navegação ─── */
      function openModule(id) {
        const mod = MODULES.find((m) => m.id === id);
        if (!mod) return;
        activeId = id;

        const welcome = document.getElementById('welcome-screen');
        const frame = document.getElementById('module-frame');
        const inline = document.getElementById('module-inline');
        const backBar = document.getElementById('back-bar');
        const backTit = document.getElementById('back-title');

        welcome.style.display = 'none';

        if (isMobile()) {
          frame.style.display = 'none';
          inline.style.display = 'block';
          inline.innerHTML = `<div style="padding:3rem 1rem;text-align:center;color:var(--muted);font-family:var(--mono);font-size:.75rem">carregando…</div>`;
          fetch(mod.file)
            .then((r) => {
              if (!r.ok) throw new Error(r.status);
              return r.text();
            })
            .then((html) => {
              const doc = new DOMParser().parseFromString(html, 'text/html');
              const styles = [...doc.querySelectorAll('style')]
                .map((s) => s.outerHTML)
                .join('');
              const baseHref = mod.file.substring(
                0,
                mod.file.lastIndexOf('/') + 1,
              );
              doc.querySelectorAll('a[href]').forEach((el) => {
                const href = el.getAttribute('href');
                if (
                  href &&
                  !href.startsWith('http') &&
                  !href.startsWith('/') &&
                  !href.startsWith('#') &&
                  !href.startsWith('mailto:') &&
                  !href.startsWith('javascript:') &&
                  !href.startsWith('data:')
                ) {
                  el.setAttribute('href', baseHref + href);
                }
              });
              inline.innerHTML = styles + doc.body.innerHTML;
              inline.querySelectorAll('script').forEach((old) => {
                const s = document.createElement('script');
                s.textContent = old.textContent;
                old.replaceWith(s);
              });
              window.scrollTo(0, 0);
            })
            .catch(() => {
              inline.innerHTML = `<div style="padding:2rem;color:var(--danger);font-size:.82rem;font-family:var(--sans)">Erro ao carregar. Verifique se o arquivo <code style="font-family:var(--mono)">${mod.file}</code> existe.</div>`;
            });
          backBar.style.display = 'flex';
          backTit.textContent = mod.title;
          closeDrawer();
        } else {
          inline.style.display = 'none';
          inline.innerHTML = '';
          frame.style.display = 'block';
          frame.src = mod.file;
          backBar.style.display = 'none';
        }

        syncActive(id);
        document.getElementById('sb-module').textContent = mod.title;
        document.title = `${mod.title} — SERPRO estudos`;
      }

      function goHome() {
        activeId = null;
        const frame = document.getElementById('module-frame');
        const inline = document.getElementById('module-inline');

        frame.src = 'about:blank';
        frame.style.display = 'none';
        inline.style.display = 'none';
        inline.innerHTML = '';

        document.getElementById('welcome-screen').style.display = 'flex';
        document.getElementById('back-bar').style.display = 'none';

        syncActive(null);
        document.getElementById('sb-module').textContent =
          'nenhum módulo aberto';
        document.title = 'SERPRO 2023 — Base de estudos';
        if (isMobile()) window.scrollTo(0, 0);
      }

      function syncActive(id) {
        document.querySelectorAll('[data-modid]').forEach((el) => {
          el.classList.toggle('active', el.dataset.modid === id);
        });
      }

      /* ─── build tabs ─── */
      function buildTabs() {
        const nav = document.getElementById('tabs-nav');
        const home = document.createElement('button');
        home.className = 'tab';
        home.innerHTML = `<span class="dot"></span> início`;
        home.addEventListener('click', goHome);
        nav.appendChild(home);

        MODULES.forEach((mod) => {
          const t = document.createElement('button');
          t.className = 'tab';
          t.dataset.modid = mod.id;
          t.setAttribute('role', 'tab');
          t.innerHTML = `<span>${mod.icon}</span> ${mod.title}`;
          t.addEventListener('click', () => openModule(mod.id));
          nav.appendChild(t);
        });
      }

      /* ─── build sidebar ─── */
      function buildSidebar() {
        const wrap = document.getElementById('sidebar-inner');
        const grouped = {};
        MODULES.forEach((m) => {
          const g = m.group || 'especificos';
          if (!grouped[g]) grouped[g] = [];
          grouped[g].push(m);
        });

        Object.entries(GROUPS).forEach(([key, cfg]) => {
          if (!grouped[key]?.length) return;
          const sec = document.createElement('div');
          sec.className = 'sb-section';
          const lbl = document.createElement('div');
          lbl.className = 'sb-label';
          lbl.textContent = cfg.label;
          sec.appendChild(lbl);

          grouped[key].forEach((mod) => {
            const a = document.createElement('a');
            a.className = 'sb-item';
            a.href = '#';
            a.dataset.modid = mod.id;
            const tc = TAG_MAP[mod.tag] || TAG_MAP.media;
            a.innerHTML = `<span class="icon">${mod.icon}</span><span>${mod.title}</span><span class="bpill ${tc.cls}">${tc.text}</span>`;
            a.addEventListener('click', (e) => {
              e.preventDefault();
              openModule(mod.id);
            });
            sec.appendChild(a);
          });
          wrap.appendChild(sec);
          const hr = document.createElement('hr');
          hr.className = 'sb-divider';
          wrap.appendChild(hr);
        });

        const hint = document.createElement('div');
        hint.className = 'sb-section';
        hint.style.marginTop = 'auto';
        hint.innerHTML = `
    <div class="sb-label">+ novo módulo</div>
    <div class="sb-item" style="cursor:default;font-size:.72rem;line-height:1.55;color:var(--muted);align-items:flex-start">
      <span class="icon" style="margin-top:2px">+</span>
      <span>Salve o .html em <code style="font-family:var(--mono);font-size:.65rem">/modulos/</code><br>e registre em <code style="font-family:var(--mono);font-size:.65rem">MODULES</code><br>no index.html</span>
    </div>`;
        wrap.appendChild(hint);
      }

      /* ─── build bottom nav ─── */
      function buildBottomNav() {
        const inner = document.getElementById('bnav-inner');

        const homeBtn = document.createElement('button');
        homeBtn.className = 'bnav-btn';
        homeBtn.innerHTML = `<span class="bnav-icon">⌂</span><span>início</span>`;
        homeBtn.addEventListener('click', goHome);
        inner.appendChild(homeBtn);

        MODULES.forEach((mod) => {
          const btn = document.createElement('button');
          btn.className = 'bnav-btn';
          btn.dataset.modid = mod.id;
          btn.innerHTML = `<span class="bnav-icon">${mod.icon}</span><span>${mod.title}</span>`;
          btn.addEventListener('click', () => openModule(mod.id));
          inner.appendChild(btn);
        });
      }

      /* ─── build welcome ─── */
      function buildWelcome() {
        const grid = document.getElementById('welcome-grid');
        const tagRow = document.getElementById('tag-row');

        MODULES.forEach((mod) => {
          const card = document.createElement('div');
          card.className = 'w-card';
          card.innerHTML = `
      <div class="w-card-icon">${mod.icon}</div>
      <div class="w-card-title">${mod.title}</div>
      <div class="w-card-sub">${mod.desc}</div>`;
          card.addEventListener('click', () => openModule(mod.id));
          grid.appendChild(card);
        });

        TOPIC_TAGS.forEach((t) => {
          const el = document.createElement('span');
          el.className = 'tag';
          el.textContent = t;
          tagRow.appendChild(el);
        });

        document.getElementById('sb-count').textContent =
          `${MODULES.length} módulo${MODULES.length !== 1 ? 's' : ''}`;
      }

      /* ─── resize: recarrega no modo certo ─── */
      let lastMobile = isMobile();
      window.addEventListener('resize', () => {
        const now = isMobile();
        if (now === lastMobile) return;
        lastMobile = now;
        if (!now) closeDrawer();
        if (activeId) openModule(activeId);
      });

      /* ─── init ─── */
      buildTabs();
      buildSidebar();
      buildBottomNav();
      buildWelcome();
    </script>
  </body>
</html>
