<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Semana 3–4 — SERPRO</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600&family=DM+Serif+Display&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --bg: #090b11;
        --surface: #111422;
        --card: #171c2c;
        --border: #242b3d;
        --border2: #343c54;
        --text: #f1f5f9;
        --muted: #708098;
        --accent: #c9a84c;      /* Dourado */
        --purple: #8b5cf6;      /* Roxo */
        --indigo: #6366f1;      /* Indigo */
        --cyan: #06b6d4;        /* Ciano */
        --green: #10b981;       /* Verde */
        --danger: #f43f5e;      /* Vermelho */
        --warning: #f59e0b;     /* Laranja */
        --mono: 'JetBrains Mono', monospace;
        --sans: 'Plus Jakarta Sans', sans-serif;
        --serif: 'DM Serif Display', serif;
        --sidebar-w: 270px;
        --topbar-h: 64px;
      }

      *,
      *::before,
      *::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      html,
      body {
        height: 100vh;
        background: var(--bg);
        color: var(--text);
        font-family: var(--sans);
        line-height: 1.6;
        -webkit-font-smoothing: antialiased;
        overflow: hidden;
      }

      /* Scrollbar Customizado */
      ::-webkit-scrollbar {
        width: 8px;
        height: 8px;
      }
      ::-webkit-scrollbar-track {
        background: var(--bg);
      }
      ::-webkit-scrollbar-thumb {
        background: var(--border);
        border-radius: 4px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: var(--border2);
      }

      .layout {
        display: grid;
        grid-template-columns: var(--sidebar-w) minmax(0, 1fr);
        width: 100%;
        height: 100vh;
        overflow: hidden;
      }

      .drawer-overlay {
        display: none;
        position: fixed;
        inset: 0;
        background: rgba(5, 6, 10, 0.8);
        backdrop-filter: blur(4px);
        z-index: 190;
        opacity: 0;
        transition: opacity 0.25s ease;
      }
      .drawer-overlay.visible {
        display: block;
      }
      .drawer-overlay.open {
        opacity: 1;
      }

      /* ─── TOPBAR MOBILE ─── */
      .topbar {
        display: none;
        align-items: center;
        gap: 0.75rem;
        padding: 0 1.25rem;
        height: var(--topbar-h);
        background: var(--surface);
        border-bottom: 1px solid var(--border);
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        z-index: 180;
        box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
      }
      .hamburger {
        width: 44px;
        height: 44px;
        border: 1px solid var(--border);
        border-radius: 10px;
        background: rgba(255, 255, 255, 0.02);
        color: var(--text);
        font-size: 1.2rem;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        transition: all 0.2s;
      }
      .hamburger:hover {
        background: rgba(255, 255, 255, 0.06);
        border-color: var(--border2);
      }
      .hamburger.open {
        background: rgba(6, 182, 212, 0.1);
        border-color: var(--cyan);
        color: var(--cyan);
      }
      .topbar-title {
        font-family: var(--serif);
        font-size: 1.15rem;
        color: var(--text);
        font-weight: 500;
      }

      /* ─── SIDEBAR ─── */
      .sidebar {
        background: var(--surface);
        border-right: 1px solid var(--border);
        padding: 1.5rem 1.25rem;
        display: flex;
        flex-direction: column;
        gap: 1.25rem;
        position: sticky;
        top: 0;
        height: 100vh;
        overflow-y: auto;
      }
      .sidebar .logo-container {
        display: flex;
        flex-direction: column;
        gap: 0.25rem;
      }
      .sidebar .logo {
        font-family: var(--serif);
        font-size: 1.5rem;
        line-height: 1.1;
        background: linear-gradient(135deg, var(--text) 50%, var(--cyan));
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
      }
      .sidebar .subtitle {
        font-size: 0.78rem;
        color: var(--muted);
        line-height: 1.5;
      }

      .sb-back-btn {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 10px 12px;
        border-radius: 10px;
        font-size: 0.78rem;
        font-weight: 500;
        color: var(--muted);
        text-decoration: none;
        border: 1px solid var(--border);
        background: rgba(255, 255, 255, 0.01);
        transition: all 0.2s;
      }
      .sb-back-btn:hover {
        color: var(--accent);
        border-color: var(--accent);
        background: rgba(201, 168, 76, 0.05);
        transform: translateY(-1px);
      }

      .nav-label {
        font-family: var(--mono);
        font-size: 0.65rem;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        color: var(--muted);
        border-bottom: 1px solid var(--border);
        padding-bottom: 0.35rem;
        margin-top: 0.5rem;
      }
      .nav-list {
        display: flex;
        flex-direction: column;
        gap: 0.45rem;
      }
      .nav-group {
        display: flex;
        flex-direction: column;
        gap: 0.45rem;
      }
      .nav-group .nav-children {
        display: none;
        flex-direction: column;
        gap: 0.45rem;
        padding-left: 0.6rem;
        border-left: 1px solid var(--border);
        margin-left: 0.55rem;
      }
      .nav-group.open .nav-children {
        display: flex;
      }
      .nav-item.group-toggle {
        background: rgba(255, 255, 255, 0.02);
        border: 1px solid var(--border);
        cursor: pointer;
      }
      .nav-item.group-toggle::after {
        content: '▼';
        font-size: 8px;
        color: var(--muted);
        transition: transform 0.2s;
      }
      .nav-group.open > .group-toggle::after {
        transform: rotate(-180deg);
        color: var(--cyan);
      }
      .nav-item {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 0.6rem;
        padding: 0.8rem 1rem;
        border-radius: 10px;
        background: rgba(255, 255, 255, 0.01);
        border: 1px solid transparent;
        color: var(--text);
        text-decoration: none;
        font-size: 0.85rem;
        font-weight: 500;
        cursor: pointer;
        width: 100%;
        text-align: left;
        transition: all 0.2s ease;
      }
      .nav-item:hover {
        background: rgba(255, 255, 255, 0.03);
        border-color: var(--border);
      }
      .nav-item.active {
        background: rgba(6, 182, 212, 0.08);
        border-color: rgba(6, 182, 212, 0.3);
        color: var(--cyan);
      }
      .nav-item.nested {
        padding-left: 0.75rem;
      }
      .nav-item .meta {
        font-family: var(--mono);
        font-size: 0.65rem;
        color: var(--muted);
        padding: 1px 5px;
        border-radius: 4px;
        background: rgba(255, 255, 255, 0.04);
      }
      .nav-item.active .meta {
        background: rgba(6, 182, 212, 0.12);
        color: var(--cyan);
      }

      .footer-note {
        margin-top: auto;
        padding-top: 1rem;
        border-top: 1px solid var(--border);
        color: var(--muted);
        font-size: 0.7rem;
        line-height: 1.5;
      }

      /* ─── MAIN CONTENT ─── */
      .main {
        display: flex;
        flex-direction: column;
        min-width: 0;
        height: 100vh;
        overflow-y: auto;
      }
      .content-area {
        flex: 1;
        padding: 2.5rem 3rem;
        max-width: 1100px;
        width: 100%;
        margin: 0 auto;
      }
      .content-area > .loading {
        color: var(--muted);
        font-family: var(--mono);
        font-size: 0.85rem;
        display: flex;
        align-items: center;
        gap: 0.5rem;
        padding: 3rem 0;
      }

      /* ─── DYNAMIC PAGINATION FOOTER ─── */
      .content-nav-footer {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-top: 4rem;
        padding-top: 2rem;
        border-top: 1px solid var(--border);
        gap: 1rem;
        flex-wrap: wrap;
      }
      .nav-footer-btn {
        display: inline-flex;
        align-items: center;
        gap: 0.6rem;
        padding: 0.9rem 1.4rem;
        border-radius: 12px;
        font-family: var(--sans);
        font-size: 0.85rem;
        font-weight: 600;
        color: var(--text);
        background: var(--card);
        border: 1px solid var(--border);
        cursor: pointer;
        text-decoration: none;
        transition: all 0.2s ease;
        min-height: 48px;
      }
      .nav-footer-btn:hover {
        border-color: var(--cyan);
        background: rgba(6, 182, 212, 0.05);
        transform: translateY(-2px);
        box-shadow: 0 4px 12px rgba(6, 182, 212, 0.15);
      }
      .nav-footer-btn.next {
        margin-left: auto;
        background: linear-gradient(135deg, rgba(6, 182, 212, 0.08), rgba(139, 92, 246, 0.08));
        border-color: rgba(6, 182, 212, 0.2);
      }
      .nav-footer-btn.next:hover {
        background: linear-gradient(135deg, rgba(6, 182, 212, 0.15), rgba(139, 92, 246, 0.15));
        border-color: var(--cyan);
      }
      .nav-footer-btn span.label {
        font-size: 0.72rem;
        text-transform: uppercase;
        letter-spacing: 0.08em;
        color: var(--muted);
        display: block;
        font-weight: 500;
      }
      .nav-footer-btn span.title {
        display: block;
      }

      /* ═══════════════════════════════════════
         SHARED PREMIUM CSS DESIGN SYSTEM
         (Used by fetched pages)
      ═══════════════════════════════════════ */

      /* Page Header (.ph) */
      .ph {
        padding: 0 0 2rem;
        border-bottom: 1px solid var(--border);
        margin-bottom: 2.5rem;
      }
      .ph-meta {
        font-family: var(--mono);
        font-size: 0.65rem;
        color: var(--cyan);
        letter-spacing: 0.15em;
        text-transform: uppercase;
        margin-bottom: 0.6rem;
        font-weight: 600;
      }
      .ph-title {
        font-family: var(--serif);
        font-size: clamp(1.8rem, 4vw, 2.6rem);
        line-height: 1.15;
        margin-bottom: 0.6rem;
        color: var(--text);
      }
      .ph-title em {
        color: var(--accent);
        font-style: normal;
        background: linear-gradient(135deg, var(--accent) 30%, #f7dfa4);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
      }
      .ph-desc {
        font-size: 0.95rem;
        color: var(--muted);
        max-width: 800px;
        line-height: 1.65;
      }
      .ph-pills {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        margin-top: 1.25rem;
      }
      .pill {
        font-family: var(--mono);
        font-size: 0.62rem;
        padding: 3px 8px;
        border-radius: 6px;
        border: 1px solid var(--border);
        color: var(--muted);
        background: rgba(255, 255, 255, 0.02);
      }
      .pill-r { border-color: rgba(244, 63, 94, 0.3); color: var(--danger); background: rgba(244, 63, 94, 0.04); }
      .pill-a { border-color: rgba(201, 168, 76, 0.3); color: var(--accent); background: rgba(201, 168, 76, 0.04); }
      .pill-g { border-color: rgba(16, 185, 129, 0.3); color: var(--green); background: rgba(16, 185, 129, 0.04); }
      .pill-p { border-color: rgba(139, 92, 246, 0.3); color: var(--purple); background: rgba(139, 92, 246, 0.04); }

      /* Cards (.card) */
      .card {
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: 14px;
        padding: 1.5rem;
        margin-bottom: 1.25rem;
        transition: all 0.25s ease;
      }
      .card:hover {
        border-color: var(--border2);
        transform: translateY(-2px);
        box-shadow: 0 8px 24px rgba(0, 0, 0, 0.2);
      }
      .card-title {
        font-size: 1.05rem;
        font-weight: 600;
        color: var(--text);
        margin-bottom: 0.85rem;
        display: flex;
        align-items: center;
        gap: 10px;
        flex-wrap: wrap;
      }

      /* Badges (.badge) */
      .badge {
        font-family: var(--mono);
        font-size: 0.62rem;
        font-weight: 600;
        padding: 2px 8px;
        border-radius: 5px;
        border: 1px solid var(--border);
        white-space: nowrap;
      }
      .b-r { border-color: rgba(244, 63, 94, 0.4); color: var(--danger); background: rgba(244, 63, 94, 0.06); }
      .b-g { border-color: rgba(16, 185, 129, 0.4); color: var(--green); background: rgba(16, 185, 129, 0.06); }
      .b-p { border-color: rgba(139, 92, 246, 0.4); color: var(--purple); background: rgba(139, 92, 246, 0.06); }
      .b-a { border-color: rgba(201, 168, 76, 0.4); color: var(--accent); background: rgba(201, 168, 76, 0.06); }
      .b-i { border-color: rgba(6, 182, 212, 0.4); color: var(--cyan); background: rgba(6, 182, 212, 0.06); }

      /* Row Items (.row-item) */
      .row-item {
        display: flex;
        gap: 15px;
        padding: 0.85rem 0;
        border-top: 1px solid var(--border);
        font-size: 0.88rem;
        line-height: 1.6;
        align-items: flex-start;
      }
      .row-item:first-child,
      .row-item:first-of-type {
        border-top: none;
      }
      .row-key {
        font-family: var(--mono);
        font-size: 0.72rem;
        font-weight: 600;
        color: var(--accent);
        white-space: nowrap;
        flex-shrink: 0;
        padding-top: 2px;
        min-width: 110px;
      }
      .row-val {
        flex: 1;
        color: var(--text);
      }
      .row-val code {
        font-family: var(--mono);
        font-size: 0.72rem;
        color: var(--cyan);
        background: rgba(6, 182, 212, 0.06);
        padding: 2px 6px;
        border-radius: 4px;
        border: 1px solid rgba(6, 182, 212, 0.15);
      }

      /* Callout Boxes (.trap, .tip, .note) */
      .trap, .tip, .note {
        padding: 1.1rem 1.4rem;
        font-size: 0.85rem;
        margin: 1.25rem 0;
        line-height: 1.65;
        border-radius: 8px;
        border-left: 4px solid;
      }
      .trap {
        border-color: var(--danger);
        background: rgba(244, 63, 94, 0.04);
        color: #fca5a5;
      }
      .trap strong { color: var(--danger); font-weight: 600; }
      
      .tip {
        border-color: var(--accent);
        background: rgba(201, 168, 76, 0.04);
        color: #f7dfa4;
      }
      .tip strong { color: var(--accent); font-weight: 600; }

      .note {
        border-color: var(--cyan);
        background: rgba(6, 182, 212, 0.04);
        color: #9cdbfb;
      }
      .note strong { color: var(--cyan); font-weight: 600; }

      /* Code Blocks (.code) */
      .code {
        background: #06070a;
        border: 1px solid var(--border);
        border-radius: 10px;
        padding: 1.25rem;
        font-family: var(--mono);
        font-size: 0.78rem;
        line-height: 1.7;
        overflow-x: auto;
        margin: 1rem 0;
        color: #cbd5e1;
      }
      .code .kw { color: var(--purple); }
      .code .fn { color: var(--cyan); }
      .code .str { color: var(--green); }
      .code .num { color: var(--accent); }
      .code .cm { color: var(--muted); font-style: italic; }

      /* Table Styles */
      .tbl-wrap {
        overflow-x: auto;
        margin: 1.25rem 0;
        border-radius: 10px;
        border: 1px solid var(--border);
      }
      table {
        border-collapse: collapse;
        font-size: 0.8rem;
        width: 100%;
        min-width: 500px;
      }
      th {
        background: #0d0f1a;
        color: var(--muted);
        font-family: var(--mono);
        font-size: 0.68rem;
        text-transform: uppercase;
        letter-spacing: 0.08em;
        padding: 10px 12px;
        text-align: left;
        border-bottom: 1px solid var(--border);
        border-right: 1px solid var(--border);
      }
      th:last-child { border-right: none; }
      td {
        padding: 10px 12px;
        border-bottom: 1px solid var(--border);
        border-right: 1px solid var(--border);
        vertical-align: top;
      }
      td:last-child { border-right: none; }
      tr:last-child td { border-bottom: none; }

      .example {
        background: rgba(139, 92, 246, 0.03);
        border: 1px solid rgba(139, 92, 246, 0.15);
        border-radius: 8px;
        padding: 1rem 1.25rem;
        margin: 1rem 0;
        font-size: 0.85rem;
      }
      .example-label {
        font-family: var(--mono);
        font-size: 0.65rem;
        text-transform: uppercase;
        letter-spacing: 0.08em;
        color: var(--purple);
        margin-bottom: 4px;
        font-weight: 600;
      }

      /* ─── FLASHCARDS (.fc) ─── */
      .fc-filters {
        display: flex;
        gap: 6px;
        flex-wrap: wrap;
        margin-bottom: 1.25rem;
      }
      .fc-filter {
        font-family: var(--mono);
        font-size: 0.68rem;
        font-weight: 500;
        padding: 6px 12px;
        border-radius: 8px;
        border: 1px solid var(--border);
        color: var(--muted);
        background: transparent;
        cursor: pointer;
        transition: all 0.2s;
        min-height: 38px;
      }
      .fc-filter.on {
        color: var(--accent);
        border-color: rgba(201, 168, 76, 0.35);
        background: rgba(201, 168, 76, 0.08);
      }
      .fc-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
        gap: 12px;
        margin-top: 1rem;
      }
      .fc {
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: 12px;
        padding: 1.5rem;
        cursor: pointer;
        min-height: 140px;
        display: flex;
        flex-direction: column;
        gap: 0.5rem;
        transition: all 0.25s ease;
        -webkit-tap-highlight-color: transparent;
      }
      .fc:hover {
        border-color: var(--border2);
        transform: translateY(-2px);
      }
      .fc.flipped {
        border-color: rgba(201, 168, 76, 0.3);
        background: rgba(201, 168, 76, 0.02);
      }
      .fc-q {
        font-size: 0.88rem;
        font-weight: 600;
        color: var(--text);
        line-height: 1.5;
      }
      .fc-a {
        font-size: 0.82rem;
        color: var(--muted);
        line-height: 1.6;
        display: none;
        border-top: 1px dashed var(--border);
        padding-top: 0.6rem;
        margin-top: 0.25rem;
      }
      .fc.flipped .fc-q {
        color: var(--accent);
      }
      .fc.flipped .fc-a {
        display: block;
      }
      .fc-hint {
        font-family: var(--mono);
        font-size: 0.62rem;
        color: var(--muted);
        margin-top: auto;
        opacity: 0.6;
        text-transform: uppercase;
        letter-spacing: 0.05em;
      }
      .fc-tag {
        font-family: var(--mono);
        font-size: 0.6rem;
        padding: 2px 6px;
        border-radius: 4px;
        border: 1px solid rgba(201, 168, 76, 0.2);
        color: var(--accent);
        background: rgba(201, 168, 76, 0.04);
        display: inline-block;
        margin-bottom: 4px;
        width: fit-content;
      }

      /* ─── SIMULADO CEBRASPE (.q-block) ─── */
      .score-row {
        display: flex;
        align-items: center;
        gap: 1rem;
        margin-bottom: 1.5rem;
        font-family: var(--mono);
        font-size: 0.72rem;
        color: var(--muted);
        flex-wrap: wrap;
      }
      .prog {
        height: 6px;
        flex: 1;
        min-width: 120px;
        background: var(--border);
        border-radius: 3px;
        overflow: hidden;
      }
      .prog-f {
        height: 100%;
        background: var(--green);
        border-radius: 3px;
        transition: width 0.3s;
        width: 0%;
      }
      .q-block {
        background: var(--card);
        border: 1px solid var(--border);
        border-left: 4px solid var(--purple);
        border-radius: 0 12px 12px 0;
        padding: 1.5rem;
        margin-bottom: 1rem;
        transition: all 0.2s;
      }
      .q-block:hover {
        border-color: var(--border2);
        border-left-color: var(--purple);
      }
      .q-num {
        font-family: var(--mono);
        font-size: 0.65rem;
        color: var(--muted);
        margin-bottom: 0.6rem;
        display: flex;
        align-items: center;
        gap: 8px;
        text-transform: uppercase;
      }
      .q-tag {
        font-family: var(--mono);
        font-size: 0.58rem;
        padding: 1px 6px;
        border-radius: 4px;
        border: 1px solid var(--border);
        color: var(--muted);
        background: rgba(255, 255, 255, 0.02);
      }
      .q-text {
        font-size: 0.88rem;
        line-height: 1.7;
        margin-bottom: 1rem;
        color: var(--text);
      }
      .ce-row {
        display: flex;
        gap: 10px;
        flex-wrap: wrap;
        margin-bottom: 1rem;
      }
      .btn-ce {
        flex: 1;
        min-width: 100px;
        padding: 10px 16px;
        border-radius: 8px;
        font-size: 0.82rem;
        font-weight: 600;
        font-family: var(--sans);
        cursor: pointer;
        border: 1px solid;
        background: transparent;
        transition: all 0.15s ease;
        -webkit-tap-highlight-color: transparent;
        min-height: 44px;
      }
      .btn-c { border-color: rgba(16, 185, 129, 0.3); color: var(--green); }
      .btn-e { border-color: rgba(244, 63, 94, 0.3); color: var(--danger); }
      .btn-c:hover { background: rgba(16, 185, 129, 0.05); }
      .btn-e:hover { background: rgba(244, 63, 94, 0.05); }
      
      .btn-c.ok { background: rgba(16, 185, 129, 0.12); font-weight: 700; border-color: var(--green); color: #fff; }
      .btn-e.ok { background: rgba(16, 185, 129, 0.12); font-weight: 700; border-color: var(--green); color: #fff; } /* Se escolheu Errado e a resposta era Errado, fica verde! */
      .btn-c.no { background: rgba(244, 63, 94, 0.08); opacity: 0.5; border-color: var(--danger); }
      .btn-e.no { background: rgba(244, 63, 94, 0.08); opacity: 0.5; border-color: var(--danger); }

      .q-actions {
        display: flex;
        gap: 8px;
      }
      .btn {
        font-family: var(--mono);
        font-size: 0.65rem;
        font-weight: 500;
        padding: 6px 12px;
        border-radius: 6px;
        border: 1px solid var(--border);
        color: var(--muted);
        background: transparent;
        cursor: pointer;
        transition: all 0.2s;
        text-transform: uppercase;
        min-height: 36px;
      }
      .btn:hover {
        color: var(--text);
        border-color: var(--border2);
      }
      .q-gab {
        background: rgba(255, 255, 255, 0.015);
        border-radius: 8px;
        padding: 1rem;
        font-size: 0.82rem;
        color: var(--muted);
        margin-top: 10px;
        display: none;
        line-height: 1.65;
        border: 1px solid var(--border);
      }
      .q-gab.show { display: block; }
      .q-gab strong { color: var(--text); }

      /* Resource links (.link-card) */
      .link-card {
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: 12px;
        padding: 1.25rem 1.5rem;
        margin-bottom: 1rem;
      }
      .link-card-title {
        font-size: 0.95rem;
        font-weight: 600;
        color: var(--text);
        margin-bottom: 0.75rem;
        display: flex;
        align-items: center;
        gap: 8px;
        flex-wrap: wrap;
        padding-bottom: 0.5rem;
        border-bottom: 1px solid var(--border);
      }
      .link-item {
        display: flex;
        flex-direction: column;
        gap: 3px;
        padding: 0.75rem 0;
        border-top: 1px solid var(--border);
      }
      .link-item:first-of-type { border-top: none; }
      .link-title { font-size: 0.85rem; font-weight: 600; color: var(--text); }
      .link-sub { font-size: 0.78rem; color: var(--muted); line-height: 1.5; }
      .link-a {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        font-family: var(--mono);
        font-size: 0.68rem;
        color: var(--cyan);
        text-decoration: none;
        margin-top: 4px;
        transition: opacity 0.15s;
        font-weight: 500;
      }
      .link-a:hover { opacity: 0.8; text-decoration: underline; }

      /* Navigation Dashboard Cards inside Visão Geral */
      .dashboard-nav-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
        gap: 16px;
        margin-top: 2rem;
      }
      .db-nav-card {
        background: linear-gradient(135deg, var(--card), rgba(23, 28, 44, 0.6));
        border: 1px dashed var(--border);
        border-radius: 14px;
        padding: 1.75rem;
        cursor: pointer;
        transition: all 0.25s ease;
        display: flex;
        flex-direction: column;
        gap: 0.5rem;
      }
      .db-nav-card:hover {
        border-style: solid;
        border-color: var(--cyan);
        transform: translateY(-3px);
        box-shadow: 0 10px 25px rgba(6, 182, 212, 0.08);
      }
      .db-nav-meta {
        font-family: var(--mono);
        font-size: 0.62rem;
        color: var(--cyan);
        text-transform: uppercase;
        letter-spacing: 0.1em;
      }
      .db-nav-title {
        font-size: 1.15rem;
        font-weight: 700;
        color: var(--text);
      }
      .db-nav-desc {
        font-size: 0.8rem;
        color: var(--muted);
        line-height: 1.6;
      }
      .db-nav-action {
        font-family: var(--mono);
        font-size: 0.65rem;
        color: var(--accent);
        margin-top: auto;
        display: flex;
        align-items: center;
        gap: 4px;
        font-weight: 600;
        text-transform: uppercase;
        padding-top: 0.75rem;
      }

      /* ═══════════════════════════════════════
         RESPONSIVIDADE (MOBILE & TABLET)
      ═══════════════════════════════════════ */

      @media (max-width: 960px) {
        html,
        body {
          height: auto;
          overflow: visible;
          overflow-x: hidden;
        }
        .layout {
          display: block;
          padding-top: var(--topbar-h);
          height: auto;
          overflow: visible;
        }
        .main {
          height: auto;
          overflow: visible;
        }
        .topbar {
          display: flex;
        }
        .sidebar {
          position: fixed;
          top: var(--topbar-h);
          left: 0;
          bottom: 0;
          width: min(300px, 85vw);
          z-index: 200;
          box-shadow: 4px 0 25px rgba(0, 0, 0, 0.4);
          transform: translateX(-100%);
          opacity: 0;
          visibility: hidden;
          transition: transform 0.25s cubic-bezier(0.4, 0, 0.2, 1), opacity 0.25s, visibility 0.25s;
          height: calc(100vh - var(--topbar-h));
        }
        .sidebar.open {
          transform: translateX(0);
          opacity: 1;
          visibility: visible;
        }
        .content-area {
          padding: 1.75rem 1.25rem;
        }
        .nav-item {
          padding: 0.9rem 1.1rem;
          min-height: 48px;
        }
      }

      @media (max-width: 640px) {
        .ph {
          padding-bottom: 1.5rem;
          margin-bottom: 1.75rem;
        }
        .ph-pills {
          gap: 4px;
        }
        .pill {
          font-size: 0.58rem;
          padding: 2px 6px;
        }
        .card {
          padding: 1.15rem;
        }
        .row-item {
          flex-direction: column;
          gap: 4px;
          padding: 0.75rem 0;
        }
        .row-key {
          min-width: unset;
        }
        .btn-ce {
          padding: 12px 14px;
          min-height: 48px;
          font-size: 0.8rem;
        }
        .fc-grid {
          grid-template-columns: 1fr;
        }
        .fc {
          min-height: 120px;
          padding: 1.25rem;
        }
        .content-nav-footer {
          flex-direction: column;
          align-items: stretch;
          margin-top: 3rem;
          gap: 0.75rem;
        }
        .nav-footer-btn {
          width: 100%;
          justify-content: center;
        }
        .nav-footer-btn.next {
          margin-left: 0;
        }
      }
    </style>
  </head>
  <body>
    <div class="drawer-overlay" id="drawer-overlay"></div>
    
    <header class="topbar">
      <button class="hamburger" id="hamburger" aria-label="Abrir menu" aria-expanded="false">
        ☰
      </button>
      <div class="topbar-title">Semana 3–4</div>
    </header>

    <div class="layout">
      <aside class="sidebar" id="sidebar" aria-label="Menu de Estudos">
        <div class="logo-container">
          <div class="logo">Semana 3–4</div>
          <div class="subtitle">Engenharia, Arquitetura & Segurança</div>
        </div>

        <a class="sb-back-btn" href="../index.html">
          <span>←</span>
          <span>Voltar ao SERPRO</span>
        </a>

        <div class="nav-label">Conteúdo</div>
        <nav class="nav-list" id="nav-list"></nav>

        <div class="footer-note">
          Modo Estudo Ativo · Dúvidas consulte a documentação complementar em PDF.
        </div>
      </aside>

      <main class="main">
        <section class="content-area" id="page-content">
          <div class="loading">Carregando conteúdo...</div>
        </section>
      </main>
    </div>

    <script>
      const SUBPAGES = [
        {
          id: 'resumo',
          title: 'Visão geral',
          file: 'semana-3-4.html',
          meta: 'Início',
        },
        {
          id: 'serpro',
          title: 'Conteúdo SERPRO',
          meta: 'Módulo',
          children: [
            {
              id: 'devops',
              title: 'DevOps & Infraestrutura',
              file: 'tema-devops-infra.html',
              meta: 'CI/CD & Docker',
            },
            {
              id: 'arquitetura',
              title: 'Arquitetura & Design',
              file: 'tema-arquitetura-design.html',
              meta: 'Padrões & SOLID',
            },
            {
              id: 'seguranca',
              title: 'Segurança & LGPD',
              file: 'tema-seguranca-legal.html',
              meta: 'ISO & LGPD',
            },
          ],
        },
      ];

      let activePage = null;
      let drawerOpen = false;

      function openDrawer() {
        document.getElementById('sidebar').classList.add('open');
        document.getElementById('hamburger').classList.add('open');
        document.getElementById('hamburger').setAttribute('aria-expanded', 'true');
        const overlay = document.getElementById('drawer-overlay');
        overlay.classList.add('visible');
        requestAnimationFrame(() => overlay.classList.add('open'));
        document.body.style.overflow = 'hidden';
        drawerOpen = true;
      }

      function closeDrawer() {
        document.getElementById('sidebar').classList.remove('open');
        document.getElementById('hamburger').classList.remove('open');
        document.getElementById('hamburger').setAttribute('aria-expanded', 'false');
        const overlay = document.getElementById('drawer-overlay');
        overlay.classList.remove('open');
        document.body.style.overflow = '';
        drawerOpen = false;
        setTimeout(() => overlay.classList.remove('visible'), 220);
      }

      function toggleDrawer() {
        drawerOpen ? closeDrawer() : openDrawer();
      }

      function getPageSequence() {
        const seq = [];
        SUBPAGES.forEach((p) => {
          if (p.children) {
            p.children.forEach((c) => seq.push(c));
          } else {
            seq.push(p);
          }
        });
        return seq;
      }

      function buildSidebarItems(items, container, depth = 0) {
        items.forEach((item) => {
          if (item.children) {
            const group = document.createElement('div');
            group.className = 'nav-group open';

            const header = document.createElement('button');
            header.type = 'button';
            header.className = 'nav-item group-toggle';
            header.innerHTML = `<span>${item.title}</span><span class="meta">${item.meta || 'Seção'}</span>`;
            header.addEventListener('click', () => {
              group.classList.toggle('open');
            });
            group.appendChild(header);

            const childList = document.createElement('div');
            childList.className = 'nav-children';
            buildSidebarItems(item.children, childList, depth + 1);
            group.appendChild(childList);
            container.appendChild(group);
          } else {
            const link = document.createElement('button');
            link.type = 'button';
            link.className = 'nav-item';
            if (depth > 0) link.classList.add('nested');
            link.dataset.page = item.id;
            link.innerHTML = `<span>${item.title}</span><span class="meta">${item.meta}</span>`;
            link.addEventListener('click', () => {
              loadPage(item);
              if (window.innerWidth <= 960) closeDrawer();
            });
            container.appendChild(link);
          }
        });
      }

      function buildSidebar() {
        const nav = document.getElementById('nav-list');
        buildSidebarItems(SUBPAGES, nav);
      }

      function highlightActive(id) {
        document.querySelectorAll('.nav-item').forEach((item) => {
          item.classList.toggle('active', item.dataset.page === id);
        });
        const activeItem = document.querySelector(`.nav-item[data-page="${id}"]`);
        if (activeItem) {
          const parentGroup = activeItem.closest('.nav-group');
          if (parentGroup) parentGroup.classList.add('open');
        }
      }

      function loadPage(page) {
        if (!page) return;
        activePage = page.id;
        const container = document.getElementById('page-content');
        container.innerHTML =
          '<div class="loading">Carregando ' + page.title + '…</div>';

        fetch(page.file)
          .then((response) => {
            if (!response.ok) throw new Error('Erro ' + response.status);
            return response.text();
          })
          .then((html) => {
            const doc = new DOMParser().parseFromString(html, 'text/html');
            const styles = [...doc.querySelectorAll('style')]
              .map((node) => node.outerHTML)
              .join('');
            const baseHref = page.file.substring(
              0,
              page.file.lastIndexOf('/') + 1,
            );
            const bodyClone = doc.body.cloneNode(true);
            bodyClone
              .querySelectorAll('script')
              .forEach((node) => node.remove());
            
            // Build content inner html
            container.innerHTML = styles + `<base href="${baseHref}">` + bodyClone.innerHTML;

            // Execute scripts inside the subpage
            [...doc.querySelectorAll('script')].forEach((old) => {
              const script = document.createElement('script');
              if (old.src) script.src = old.src;
              script.textContent = old.textContent;
              container.appendChild(script);
            });

            // Inject the dynamic sequential navigation footer
            injectNavFooter(page.id, container);

            document.title = page.title + ' — Semana 3–4';
            highlightActive(page.id);
            window.scrollTo(0, 0);
          })
          .catch((err) => {
            console.error(err);
            container.innerHTML =
              '<div class="loading">Erro ao carregar ' + page.title + '.</div>';
          });
      }

      function injectNavFooter(currentPageId, container) {
        const sequence = getPageSequence();
        const currentIndex = sequence.findIndex(p => p.id === currentPageId);
        if (currentIndex === -1) return;

        const footer = document.createElement('div');
        footer.className = 'content-nav-footer';

        if (currentIndex > 0) {
          const prevPage = sequence[currentIndex - 1];
          const prevBtn = document.createElement('button');
          prevBtn.className = 'nav-footer-btn';
          prevBtn.innerHTML = `
            <span>←</span>
            <div>
              <span class="label">Anterior</span>
              <span class="title">${prevPage.title}</span>
            </div>
          `;
          prevBtn.addEventListener('click', () => loadPage(prevPage));
          footer.appendChild(prevBtn);
        }

        if (currentIndex < sequence.length - 1) {
          const nextPage = sequence[currentIndex + 1];
          const nextBtn = document.createElement('button');
          nextBtn.className = 'nav-footer-btn next';
          nextBtn.innerHTML = `
            <div>
              <span class="label">Próximo</span>
              <span class="title">${nextPage.title}</span>
            </div>
            <span>→</span>
          `;
          nextBtn.addEventListener('click', () => loadPage(nextPage));
          footer.appendChild(nextBtn);
        }

        container.appendChild(footer);
      }

      // Add a function to programmatically open a subpage by ID (used by dashboard cards)
      window.navigateToTopic = function(topicId) {
        const sequence = getPageSequence();
        const page = sequence.find(p => p.id === topicId);
        if (page) {
          loadPage(page);
        }
      };

      window.addEventListener('DOMContentLoaded', () => {
        buildSidebar();
        document.getElementById('hamburger').addEventListener('click', toggleDrawer);
        document.getElementById('drawer-overlay').addEventListener('click', closeDrawer);
        document.addEventListener('keydown', (event) => {
          if (event.key === 'Escape' && drawerOpen) closeDrawer();
        });
        
        // Check if there is an anchor or hash in URL, otherwise load general overview
        loadPage(SUBPAGES[0]);
      });
    </script>
  </body>
</html>
